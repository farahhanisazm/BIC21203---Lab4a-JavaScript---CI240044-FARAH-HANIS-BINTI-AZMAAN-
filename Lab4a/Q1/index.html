
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4a - Question 1</title>

    <script src="script.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fff0f5, #f8bbd0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            padding: 50px 45px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border: 2px solid #f8bbd0;
        }

        h1 {
            color: #222222;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #b85c85;
            font-size: 14px;
            margin-bottom: 30px;
        }

        #myElement {
            background-color: #fff0f5;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #f8bbd0;
        }

        #message {
            color: #222222;
            font-size: 18px;
            font-weight: 500;
        }

        #changeBtn {
            background-color: #222222;
            color: #ffffff;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #changeBtn:hover {
            background-color: #e879a5;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(232, 121, 165, 0.3);
        }

        #changeBtn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999999;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Lab 4a | Question 1</h1>

        <p class="subtitle">
            Lab 4a | Interactive Message Changer
        </p>

        <div id="myElement">
            <p id="message">Welcome to my website!</p>
        </div>

        <button id="changeBtn" type="button">
            Change Message
        </button>

        <p class="footer">
            BIC21203 Web Development <br><br> CI240044 Farah Hanis Binti Azaman
        </p>

    </div>

</body>
</html>
